<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: #f0f0f0;
        }
        .header, .footer {
            background-color: #fff;
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }
        .header {
            margin: 10px;
        }
        .footer {
            margin-top: auto;
            margin-bottom: 10px;
        }
        .login-container {
            background-color: #fff;
            border: 1px solid #ccc;
            width: 100%;
            max-width: 400px;
            margin: 20px auto;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="header">
        Home | Đăng nhập | Đăng ký
    </div>

    <div class="login-container">
        <h2 class="text-center mb-4">Màn hình đăng nhập</h2>
        <form>
            <div class="mb-3 d-flex align-items-center">
                <label for="username" class="form-label me-2" style="width: 100px;">Username</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>

            <div class="mb-3 d-flex align-items-center">
                <label for="password" class="form-label me-2" style="width: 100px;">Mật khẩu</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>

            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="remember" name="remember">
                <label class="form-check-label" for="remember">Ghi nhớ đăng nhập</label>
            </div>

            <div class="d-flex justify-content-between align-items-center">
                <a href="#" class="text-primary text-decoration-none">Quên mật khẩu</a>
                <button type="submit" class="btn btn-primary">Đăng nhập</button>
            </div>
        </form>
    </div>

    <div class="footer">
        Lập trình web @01/2024
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
